name: Build mobile app

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  eas-build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile app
        run: pnpm exec tsc -p apps/mobile/tsconfig.json --noEmit

      - name: Build with Expo Application Services
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx eas-cli@latest build --platform all --profile production --non-interactive
