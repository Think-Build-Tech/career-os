name: Deploy CareerOS to AWS

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read
  id-token: write

concurrency:
  group: careeros-development
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT_NAME: careeros
  ENVIRONMENT: development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 1
          role-session-name: careeros-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform backend
        working-directory: infra/terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=careeros/${{ env.ENVIRONMENT }}/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
          -backend-config="encrypt=true"

      - name: Bootstrap infrastructure and ECR repositories
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_ai_service_api_key: ${{ secrets.TF_VAR_AI_SERVICE_API_KEY }}
          TF_VAR_auth_token_secret: ${{ secrets.TF_VAR_AUTH_TOKEN_SECRET }}
          TF_VAR_bedrock_api_key: ${{ secrets.TF_VAR_BEDROCK_API_KEY }}
          TF_VAR_bedrock_model: ${{ vars.TF_VAR_BEDROCK_MODEL }}
        shell: bash
        run: |
          PREFIX="${PROJECT_NAME}-${ENVIRONMENT}"
          if ! aws ecr describe-repositories --repository-names "$PREFIX/api" "$PREFIX/web" "$PREFIX/ai-framework" >/dev/null 2>&1; then
            terraform apply -auto-approve -input=false -var="environment=${ENVIRONMENT}" -var="desired_count=0" -var="image_tag=bootstrap"
          fi

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}-${{ github.run_attempt }}
        shell: bash
        run: |
          PREFIX="${PROJECT_NAME}-${ENVIRONMENT}"
          docker build -f apps/api/Dockerfile -t "$REGISTRY/$PREFIX/api:$TAG" .
          docker build -f apps/web/Dockerfile -t "$REGISTRY/$PREFIX/web:$TAG" .
          docker build -f apps/ai-framework/Dockerfile -t "$REGISTRY/$PREFIX/ai-framework:$TAG" apps/ai-framework
          docker push "$REGISTRY/$PREFIX/api:$TAG"
          docker push "$REGISTRY/$PREFIX/web:$TAG"
          docker push "$REGISTRY/$PREFIX/ai-framework:$TAG"

      - name: Deploy ECS services
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_ai_service_api_key: ${{ secrets.TF_VAR_AI_SERVICE_API_KEY }}
          TF_VAR_auth_token_secret: ${{ secrets.TF_VAR_AUTH_TOKEN_SECRET }}
          TF_VAR_bedrock_api_key: ${{ secrets.TF_VAR_BEDROCK_API_KEY }}
          TF_VAR_bedrock_model: ${{ vars.TF_VAR_BEDROCK_MODEL }}
        run: terraform apply -auto-approve -input=false -var="environment=${ENVIRONMENT}" -var="image_tag=${{ github.sha }}-${{ github.run_attempt }}" -var="desired_count=1"

      - name: Wait for ECS services
        working-directory: infra/terraform
        shell: bash
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster)
          PREFIX="${PROJECT_NAME}-${ENVIRONMENT}"
          SERVICES=("$PREFIX-api" "$PREFIX-web" "$PREFIX-ai")

          # The AWS CLI waiter gives up after a relatively short fixed window.
          # ECS tasks can take longer on a first deployment while images pull,
          # ENIs attach, and the load balancer performs health checks.
          for attempt in $(seq 1 120); do
            stable=true
            for service in "${SERVICES[@]}"; do
              read -r status desired running pending rollout < <(
                aws ecs describe-services \
                  --cluster "$CLUSTER" \
                  --services "$service" \
                  --query 'services[0].[status,desiredCount,runningCount,pendingCount,deployments[?status==`PRIMARY`].rolloutState | [0]]' \
                  --output text
              )

              echo "$service status=$status desired=$desired running=$running pending=$pending rollout=$rollout"
              if [[ "$status" != "ACTIVE" || "$desired" != "$running" || "$pending" != "0" || "$rollout" == "FAILED" || "$rollout" == "IN_PROGRESS" ]]; then
                stable=false
              fi
            done

            if [[ "$stable" == "true" ]]; then
              echo "All ECS services are stable."
              exit 0
            fi
            sleep 15
          done

          echo "ECS services did not stabilize within 30 minutes."
          exit 1

      - name: Diagnose ECS service failure
        if: ${{ failure() }}
        working-directory: infra/terraform
        shell: bash
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster)
          PREFIX="${PROJECT_NAME}-${ENVIRONMENT}"
          for service in "$PREFIX-api" "$PREFIX-web" "$PREFIX-ai"; do
            echo "===== ECS service: $service ====="
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$service" \
              --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments,events:events[0:10]}' \
              --output json || true

            running_tasks=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$service" --desired-status RUNNING --query 'taskArns[]' --output text || true)
            if [[ -n "$running_tasks" && "$running_tasks" != "None" ]]; then
              aws ecs describe-tasks \
                --cluster "$CLUSTER" \
                --tasks $running_tasks \
                --query 'tasks[].{taskArn:taskArn,lastStatus:lastStatus,healthStatus:healthStatus,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
                --output json || true
            fi

            stopped_tasks=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$service" --desired-status STOPPED --query 'taskArns[0:10]' --output text || true)
            if [[ -n "$stopped_tasks" && "$stopped_tasks" != "None" ]]; then
              aws ecs describe-tasks \
                --cluster "$CLUSTER" \
                --tasks $stopped_tasks \
                --query 'tasks[].{taskArn:taskArn,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
                --output json || true
            fi
          done

      - name: Smoke test public API
        working-directory: infra/terraform
        shell: bash
        run: |
          URL=$(terraform output -raw api_health_url)
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$URL"; then exit 0; fi
            sleep 15
          done
          exit 1
